<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Anniversary — Welcome</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#FDEFF4;      /* page bg (light pink) */
    --card:#F7D6E1;    /* card slightly darker */
    --accent:#ff6fa8;  /* bright pink accents */
    --muted:#eabece;
    --shadow: 0 12px 30px rgba(0,0,0,0.12);
    --radius:18px;
    --heartPattern: radial-gradient(circle at 10% 10%, #ffd7e8 6%, transparent 7%),
                   radial-gradient(circle at 60% 30%, #ffd7e8 6%, transparent 7%),
                   radial-gradient(circle at 30% 70%, #ffd7e8 6%, transparent 7%),
                   radial-gradient(circle at 80% 80%, #ffd7e8 6%, transparent 7%),
                   linear-gradient(135deg,#fff 0%,#ffeef5 100%);
  }

  html,body{height:100%;margin:0;font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
  body{
    background: radial-gradient(circle at 20% 10%, rgba(255,255,255,0.6), rgba(255,255,255,0)), var(--bg);
    display:flex;align-items:center;justify-content:center;
  }

  /* subtle hearts background */
  body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><defs><symbol id="h"><path d="M24 4c-6-5-16 1-16 9 0 13 16 18 16 18s16-5 16-18c0-8-10-14-16-9z" fill="%23ffd0e1"/></symbol></defs><use href="%23h" x="10" y="10" opacity="0.12"/><use href="%23h" x="110" y="60" opacity="0.09"/><use href="%23h" x="210" y="10" opacity="0.08"/><use href="%23h" x="370" y="90" opacity="0.06"/><use href="%23h" x="470" y="20" opacity="0.06"/></svg>');
    mix-blend-mode:soft-light;
    transform:scale(1.3);
  }

  .card {
    width: min(920px, 96vw);
    height: 520px;
    border-radius: var(--radius);
    background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.2)), var(--card);
    box-shadow: var(--shadow);
    display:flex;
    overflow:hidden;
    position:relative;
    border:1px solid rgba(255,255,255,0.6);
  }

  /* left photo frame */
  .photo {
    width: 52%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:36px;
    position:relative;
  }
  .frame {
    width:100%;
    max-width:380px;
    height:420px;
    background: linear-gradient(180deg,#fff,#ffeef5);
    border-radius:14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08), inset 0 2px 8px rgba(255,255,255,0.6);
    border:6px solid rgba(255,255,255,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  /* placeholder photo as SVG inline */
  .frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transform:scale(1.02);
  }
  .frame::after{
    content:"";
    position:absolute;inset:0;border-radius:inherit;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 40%);
    pointer-events:none;
  }

  /* right password area */
  .auth {
    width:48%;
    padding:42px 40px;
    display:flex;
    flex-direction:column;
    gap:18px;
    justify-content:center;
    align-items:center;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 30%);
  }

  .auth h1{
    margin:0;font-size:22px;color:#6b1530;
    text-transform:uppercase;letter-spacing:1px;
  }
  .hint{
    font-size:18px;color:#7a3a4f;opacity:0.85;
  }

  .passbox{
    width:100%;
    max-width:320px;
    background: linear-gradient(180deg,#fff,#fff0);
    padding:14px 16px;
    border-radius:12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.7);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .pass-display{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .dot{
    width:18px;height:18px;border-radius:50%;
    background:linear-gradient(180deg,#ffd4e9,#ffb6d6);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    opacity:0.35;
  }
  .controls{
    display:flex;gap:8px;align-items:center;
  }
  .clearBtn{
    background:transparent;border:0;color:#8b3a56;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:8px;
  }

  /* keypad */
  .pad{
    margin-top:6px;
    max-width:360px;
    display:grid;
    grid-template-columns:repeat(3,92px);
    grid-auto-rows:72px;
    gap:12px;
    justify-content:center;
    align-content:center;
  }
  .key{
    background:linear-gradient(180deg,#fff,#ffeef7);
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;color:#7a1533;
    cursor:pointer;user-select:none;
    box-shadow: 0 8px 14px rgba(199,87,127,0.08);
    transition:transform .12s ease, box-shadow .12s ease;
    border:1px solid rgba(255,255,255,0.6);
  }
  .key:active{ transform: translateY(4px) scale(0.995); box-shadow: 0 4px 10px rgba(199,87,127,0.06);}
  .key:hover{ transform: translateY(-4px); }
  .key.small{font-size:14px;padding:4px 10px; background:var(--muted); color:#7a2a46;}
  .key.accent{
    background: linear-gradient(180deg,var(--accent), #ff4f8a);
    color:white; box-shadow: 0 10px 24px rgba(255,95,150,0.16);
  }

  /* responsive */
  @media (max-width:880px){
    .card{flex-direction:column;height:auto;padding:30px;}
    .photo,.auth{width:100%}
    .frame{max-width:280px;height:360px}
  }

  /* small footer */
  .footer {
    position:absolute;left:180px;bottom:14px;font-size:16px;color:#7a3a4f;opacity:0.8;
  }

</style>
</head>
<body>
  <div class="card" role="main" aria-labelledby="welcomeTitle">
    <div class="photo" aria-hidden="false">
      <div class="frame" title="Photo frame">
        <!-- inline SVG placeholder of couple photo; replace with your own image -->
        <img src="z7292151744334_7b3d04c974c1b735f230ebe90322cf83.jpg" alt="Photo placeholder" />
      </div>
    </div>

    <div class="auth" aria-labelledby="titleArea">
      <div style="text-align:center;">
        <h1 id="welcomeTitle">Anniversary - 1 Year </h1>
        <div class="hint">Nhập Pass nè người đẹp</div>
      </div>

      <div class="passbox" aria-hidden="false">
        <div class="pass-display" id="passDots" aria-label="password dots">
          <!-- dots will be injected -->
        </div>
        <div class="controls">
          <button class="clearBtn" id="backspace" title="Backspace"></button>
          <button class="clearBtn" id="clear" title="Clear"></button>
        </div>
      </div>

      <div class="pad" role="application" aria-label="number pad" id="pad">
        <!-- keys injected by JS -->
      </div>

      

    </div>

    <div class="footer">Venn ❤️ Eris</div>
  </div>

<script>
/* SETTINGS */
const CORRECT_PASSWORD = "0712"; // change this to your desired password
/* End settings */

const padEl = document.getElementById('pad');
const dotsEl = document.getElementById('passDots');
const backBtn = document.getElementById('backspace');
const clearBtn = document.getElementById('clear');

let current = "";

// build keypad: classic phone layout 1-9, then * 0 #
const keys = [
  "1","2","3",
  "4","5","6",
  "7","8","9",
  "←","0","✓"
];

keys.forEach(k=>{
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'key' + (k === "✓" ? ' accent' : (k === "←" ? ' small' : ''));
  btn.textContent = k;
  btn.setAttribute('aria-label', (k === '✓' ? 'Enter' : (k === '←' ? 'Back' : 'Digit ' + k)));
  btn.addEventListener('click', ()=> onKey(k));
  padEl.appendChild(btn);
});

function updateDots(){
  dotsEl.innerHTML = '';
  for(let i=0;i<Math.max(current.length,4);i++){
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.opacity = i < current.length ? '1' : '0.25';
    dotsEl.appendChild(dot);
  }
}

function onKey(k){
  if(k === '←'){
    current = current.slice(0,-1);
    updateDots();
    return;
  }
  if(k === '✓'){
    checkPass();
    return;
  }
  // digit
  if(current.length >= 12) return; // safety cap
  current += k;
  updateDots();
}

// backspace and clear
backBtn.addEventListener('click', ()=>{
  current = current.slice(0,-1);
  updateDots();
});
clearBtn.addEventListener('click', ()=>{
  current = "";
  updateDots();
});

function checkPass(){
  // simple check
  if(current === CORRECT_PASSWORD){
    // small success animation then go to reveal page
    document.querySelector('.card').style.transform = 'scale(0.995) translateY(-6px)';
    setTimeout(()=> {
      window.location.href = 'reveal.html';
    }, 250);
  } else {
    // shake & clear
    const c = document.querySelector('.card');
    c.animate([
      { transform: 'translateX(0)' },
      { transform: 'translateX(-12px)' },
      { transform: 'translateX(10px)' },
      { transform: 'translateX(-8px)' },
      { transform: 'translateX(6px)' },
      { transform: 'translateX(0)' },
    ], { duration: 420, easing: 'ease-in-out' });
    // flash wrong color on dots
    const old = dotsEl.style.boxShadow;
    dotsEl.style.transition = 'transform .18s';
    dotsEl.style.transform = 'scale(1.03)';
    setTimeout(()=>{ dotsEl.style.transform=''; }, 180);
    current = "";
    setTimeout(updateDots, 180);
  }
}

// init dots
updateDots();

// keyboard: allow physical numeric input
window.addEventListener('keydown', (e)=>{
  if(e.key >= '0' && e.key <= '9'){ onKey(e.key); e.preventDefault(); }
  if(e.key === 'Enter') { onKey('✓'); e.preventDefault(); }
  if(e.key === 'Backspace') { onKey('←'); e.preventDefault(); }
});

</script>
</body>
</html>
